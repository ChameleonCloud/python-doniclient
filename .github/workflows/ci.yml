name: CI

env:
  PYTHON_VERSION: "3.9"
on:
  push:
  pull_request:
  release:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Deps
        run: pip install tox
      - name: Run tests
        run: tox
