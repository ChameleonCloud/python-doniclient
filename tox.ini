[tox]
minversion = 3.3.0
envlist = py310

[testenv]
basepython=python3.10
ignore_basepython_conflict=true
deps =
    -c https://releases.openstack.org/constraints/upper/2024.1
    oslotest
    stestr
    python-openstackclient

commands =
    stestr run {posargs}

[testenv:pep8]
deps =
    ruff
commands =
    ruff check {posargs}
